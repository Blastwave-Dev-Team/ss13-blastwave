<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuel Injector Prototype</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0c12;
    color: #c8d0e0;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 13px;
    overflow: hidden;
    user-select: none;
  }

  .FuelInjector {
    width: 960px;
    height: 580px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: rgba(10, 12, 18, 0.97);
    border: 1px solid rgba(80, 160, 255, 0.15);
  }

  /* ── Header ── */
  .FuelInjector__header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(80, 160, 255, 0.15);
    background: rgba(16, 20, 30, 0.85);
  }

  .FuelInjector__title {
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #c8d0e0;
  }

  .FuelInjector__parts {
    font-size: 10px;
    color: rgba(200, 208, 224, 0.45);
    letter-spacing: 0.5px;
  }

  .FuelInjector__tank-chip {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 2px;
    border: 1px solid rgba(0, 229, 255, 0.25);
    color: rgba(0, 229, 255, 0.8);
    background: rgba(0, 229, 255, 0.06);
  }

  .FuelInjector__tank-chip--empty {
    border-color: rgba(200, 208, 224, 0.15);
    color: rgba(200, 208, 224, 0.35);
    background: transparent;
  }

  .FuelInjector__header-spacer { flex: 1; }

  /* ── Main three-column stage ── */
  .FuelInjector__stage {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    flex-direction: row;
    gap: 0;
    padding: 6px;
  }

  .FuelInjector__flow {
    flex: 0 0 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(80, 160, 255, 0.25);
    font-size: 16px;
    padding-top: 40px;
  }

  .FuelInjector__panel {
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: rgba(16, 20, 30, 0.8);
    border: 1px solid rgba(80, 160, 255, 0.15);
    border-radius: 3px;
    overflow: hidden;
  }

  .FuelInjector__panel--chamber {
    flex: 1.15 1 0;
    border-color: rgba(80, 160, 255, 0.2);
  }

  .FuelInjector__panel--chamber.FuelInjector__panel--burning {
    border-color: rgba(255, 171, 0, 0.35);
    box-shadow: inset 0 0 24px rgba(255, 120, 0, 0.06);
  }

  .FuelInjector__panel-head {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 10px;
    border-bottom: 1px solid rgba(80, 160, 255, 0.12);
    background: rgba(10, 14, 22, 0.5);
  }

  .FuelInjector__panel-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(136, 204, 255, 0.65);
  }

  .FuelInjector__panel-body {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    padding: 8px 10px;
  }

  .FuelInjector__panel-body::-webkit-scrollbar { width: 4px; }
  .FuelInjector__panel-body::-webkit-scrollbar-track { background: transparent; }
  .FuelInjector__panel-body::-webkit-scrollbar-thumb { background: rgba(80, 160, 255, 0.2); border-radius: 2px; }

  /* ── Shared SysPanel components (from ShipSystems prototype) ── */
  .SysPanel__section { margin-bottom: 10px; }

  .SysPanel__section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(136, 204, 255, 0.4);
    margin-bottom: 5px;
    padding-bottom: 3px;
    border-bottom: 1px solid rgba(80, 160, 255, 0.1);
  }

  .SysPanel__row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 0;
    gap: 8px;
  }

  .SysPanel__row--metric { margin-bottom: 4px; }

  .SysPanel__label { color: rgba(200, 208, 224, 0.6); font-size: 11px; flex: 0 0 auto; }
  .SysPanel__value { color: #c8d0e0; font-size: 11px; text-align: right; }

  .SysPanel__bar {
    flex: 1 1 0;
    height: 16px;
    background: rgba(40, 50, 70, 0.6);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
    min-width: 0;
  }

  .SysPanel__bar-fill { height: 100%; border-radius: 2px; transition: width 0.25s; }
  .SysPanel__bar-fill--good { background: linear-gradient(90deg, #2d8a4e, #3dbc6a); }
  .SysPanel__bar-fill--average { background: linear-gradient(90deg, #c49a2a, #e8b830); }
  .SysPanel__bar-fill--bad { background: linear-gradient(90deg, #c43030, #e84040); }
  .SysPanel__bar-fill--energy { background: linear-gradient(90deg, rgba(0,229,255,0.4), #00e5ff); }
  .SysPanel__bar-fill--hot { background: linear-gradient(90deg, #c43030, #ff6633); }
  .SysPanel__bar-fill--warm { background: linear-gradient(90deg, #c49a2a, #ff9933); }
  .SysPanel__bar-fill--cool { background: linear-gradient(90deg, #2a6a8a, #4af); }

  .SysPanel__bar-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  .SysPanel__badge {
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 2px;
    border: 1px solid transparent;
  }

  .SysPanel__badge--idle { color: rgba(200,208,224,0.5); border-color: rgba(200,208,224,0.2); }
  .SysPanel__badge--burning {
    color: #ff7a3c;
    border-color: rgba(255,122,60,0.6);
    animation: pulse-burn 1.2s ease-in-out infinite;
  }
  .SysPanel__badge--consuming { color: #e8b830; border-color: rgba(232,184,48,0.4); }
  .SysPanel__badge--connected { color: #3dbc6a; border-color: rgba(61,188,106,0.5); }
  .SysPanel__badge--disconnected { color: rgba(200,208,224,0.35); border-color: rgba(200,208,224,0.15); }

  @keyframes pulse-burn {
    0%, 100% { box-shadow: 0 0 4px rgba(255,122,60,0.2); }
    50% { box-shadow: 0 0 10px rgba(255,122,60,0.45); }
  }

  .SysPanel__btn {
    background: rgba(30, 40, 55, 0.8);
    border: 1px solid rgba(80, 160, 255, 0.2);
    border-radius: 3px;
    color: rgba(200, 208, 224, 0.7);
    padding: 3px 10px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }

  .SysPanel__btn:hover:not(:disabled) {
    background: rgba(40, 55, 75, 0.8);
    border-color: rgba(80, 160, 255, 0.4);
    color: #c8d0e0;
  }

  .SysPanel__btn--fire {
    border-color: rgba(255, 120, 60, 0.4);
    color: #ffab60;
    padding: 6px 16px;
    font-size: 12px;
    letter-spacing: 0.5px;
  }

  .SysPanel__btn--fire:hover:not(:disabled) {
    border-color: rgba(255, 120, 60, 0.7);
    color: #ffce9a;
    background: rgba(60, 30, 15, 0.6);
  }

  .SysPanel__btn--disabled, .SysPanel__btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .SysPanel__btn--active {
    background: rgba(0, 229, 255, 0.12);
    border-color: rgba(0, 229, 255, 0.5);
    color: #00e5ff;
  }

  .SysPanel__btn--scenario {
    font-size: 9px;
    padding: 4px 8px;
    letter-spacing: 0.3px;
  }

  /* Gas composition rows */
  .FuelInjector__gas-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    margin-top: 4px;
  }

  .FuelInjector__gas-row {
    margin-bottom: 5px;
  }

  .FuelInjector__gas-row-head {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 2px;
  }

  .FuelInjector__gas-name {
    flex: 1;
    font-size: 11px;
    color: rgba(200, 208, 224, 0.75);
  }

  .FuelInjector__gas-stats {
    font-size: 10px;
    color: rgba(200, 208, 224, 0.45);
  }

  .FuelInjector__gas-chevron {
    width: 18px;
    height: 18px;
    background: rgba(30, 40, 55, 0.6);
    border: 1px solid rgba(80, 160, 255, 0.15);
    border-radius: 2px;
    color: rgba(200, 208, 224, 0.5);
    font-size: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    padding: 0;
  }

  .FuelInjector__gas-chevron:hover { border-color: rgba(80, 160, 255, 0.35); color: #c8d0e0; }

  .FuelInjector__gas-detail {
    font-size: 10px;
    color: rgba(136, 204, 255, 0.65);
    padding: 4px 0 4px 4px;
    line-height: 1.4;
  }

  .FuelInjector__gas-row--blocked .FuelInjector__gas-name,
  .FuelInjector__gas-row--blocked .FuelInjector__gas-stats {
    color: rgba(200, 208, 224, 0.35);
  }

  .FuelInjector__gas-row--blocked .FuelInjector__gas-bar {
    position: relative;
  }

  .FuelInjector__gas-row--blocked .FuelInjector__gas-bar-fill {
    filter: grayscale(0.85);
    opacity: 0.35;
  }

  .FuelInjector__gas-row--blocked .FuelInjector__gas-bar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      -45deg,
      rgba(16, 20, 28, 0.45),
      rgba(16, 20, 28, 0.45) 3px,
      rgba(24, 28, 38, 0.55) 3px,
      rgba(24, 28, 38, 0.55) 6px
    );
    border-radius: 2px;
    pointer-events: none;
  }

  .FuelInjector__gas-blocked-tag {
    font-size: 8px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: rgba(200, 208, 224, 0.35);
    border: 1px solid rgba(200, 208, 224, 0.15);
    padding: 0 4px;
    border-radius: 2px;
    margin-left: 4px;
  }

  .FuelInjector__empty-gas {
    color: rgba(200, 208, 224, 0.3);
    font-style: italic;
    font-size: 11px;
    padding: 4px 0;
  }

  /* Performance block */
  .FuelInjector__performance {
    margin-top: 10px;
    padding: 8px;
    background: rgba(10, 14, 22, 0.7);
    border: 1px solid rgba(255, 171, 0, 0.15);
    border-radius: 3px;
  }

  .FuelInjector__perf-hero {
    display: flex;
    gap: 12px;
    margin-bottom: 8px;
  }

  .FuelInjector__perf-metric {
    flex: 1;
    text-align: center;
  }

  .FuelInjector__perf-label {
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(136, 204, 255, 0.45);
    margin-bottom: 3px;
  }

  .FuelInjector__perf-value {
    font-size: 18px;
    color: #00e5ff;
    text-shadow: 0 0 8px rgba(0, 229, 255, 0.25);
  }

  .FuelInjector__perf-value--isp { color: #ffab00; text-shadow: 0 0 8px rgba(255, 171, 0, 0.2); }
  .FuelInjector__perf-value--dv { color: #3dbc6a; text-shadow: 0 0 8px rgba(61, 188, 106, 0.2); }

  .FuelInjector__perf-unit {
    font-size: 10px;
    color: rgba(200, 208, 224, 0.4);
  }

  .FuelInjector__pills {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 6px;
  }

  .FuelInjector__pill {
    font-size: 8px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 2px;
    border: 1px solid transparent;
  }

  .FuelInjector__pill--chem { color: #3dbc6a; border-color: rgba(61,188,106,0.4); background: rgba(61,188,106,0.08); }
  .FuelInjector__pill--thermal { color: #4af; border-color: rgba(68,170,255,0.35); background: rgba(68,170,255,0.06); }
  .FuelInjector__pill--warn { color: #ffab00; border-color: rgba(255,171,0,0.4); background: rgba(255,171,0,0.08); }

  .FuelInjector__factors-toggle {
    font-size: 10px;
    color: rgba(136, 204, 255, 0.5);
    cursor: pointer;
    margin-top: 4px;
    background: none;
    border: none;
    font-family: inherit;
    padding: 0;
  }

  .FuelInjector__factors-toggle:hover { color: #8cf; }

  .FuelInjector__factors {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid rgba(80, 160, 255, 0.08);
  }

  .FuelInjector__factors--hidden { display: none; }

  /* ── Footer ── */
  .FuelInjector__footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-top: 1px solid rgba(80, 160, 255, 0.15);
    background: rgba(16, 20, 30, 0.85);
  }

  .FuelInjector__scenarios {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
  }

  .FuelInjector__scenarios-label {
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(200, 208, 224, 0.35);
    margin-right: 4px;
  }

  .FuelInjector__flameout-wrap {
    position: relative;
  }

  .FuelInjector__flameout-tip {
    position: absolute;
    bottom: calc(100% + 6px);
    right: 0;
    white-space: nowrap;
    font-size: 10px;
    color: rgba(255, 171, 0, 0.75);
    background: rgba(20, 16, 10, 0.95);
    border: 1px solid rgba(255, 120, 60, 0.3);
    padding: 4px 8px;
    border-radius: 3px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .FuelInjector__flameout-wrap:hover .FuelInjector__flameout-tip--show {
    opacity: 1;
  }

  /* Scrubber-style two-stage gas filters (PipeScrubber / AtmosControls.Scrubber) */
  .FuelInjector__filter-section {
    margin: 8px 0;
    padding: 6px 0;
    border-top: 1px solid rgba(80, 160, 255, 0.1);
  }

  .FuelInjector__filter-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .FuelInjector__filter-hint {
    font-size: 9px;
    color: rgba(136, 204, 255, 0.45);
    line-height: 1.35;
    margin-bottom: 5px;
  }

  .FuelInjector__filter-note {
    font-size: 9px;
    color: rgba(255, 171, 0, 0.75);
    margin-top: 4px;
  }

  .FuelInjector__filter-note--good { color: rgba(61, 188, 106, 0.75); }

  .FuelInjector__filter-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
  }

  .FuelInjector__filter-btn {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 7px;
    font-size: 10px;
    font-family: inherit;
    letter-spacing: 0.3px;
    background: rgba(30, 40, 55, 0.75);
    border: 1px solid rgba(80, 160, 255, 0.18);
    border-radius: 2px;
    color: rgba(200, 208, 224, 0.45);
    cursor: pointer;
    transition: all 0.12s;
  }

  .FuelInjector__filter-btn:hover {
    border-color: rgba(80, 160, 255, 0.4);
    color: #c8d0e0;
  }

  .FuelInjector__filter-btn--on {
    color: #c8d0e0;
    background: rgba(0, 229, 255, 0.08);
    border-color: rgba(0, 229, 255, 0.35);
    box-shadow: inset 3px 0 0 var(--gas-accent, #00e5ff);
  }

  .FuelInjector__filter-btn--on.FuelInjector__filter-btn--exhaust {
    background: rgba(255, 120, 60, 0.08);
    border-color: rgba(255, 120, 60, 0.35);
    box-shadow: inset 3px 0 0 var(--gas-accent, #ff7840);
  }

  .FuelInjector__filter-check {
    font-size: 9px;
    opacity: 0.35;
    width: 10px;
    text-align: center;
  }

  .FuelInjector__filter-btn--on .FuelInjector__filter-check { opacity: 1; color: #3dbc6a; }
  .FuelInjector__filter-btn--on.FuelInjector__filter-btn--exhaust .FuelInjector__filter-check { color: #ffab60; }

  .FuelInjector__filter-presets {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div class="FuelInjector">
  <header class="FuelInjector__header">
    <span class="FuelInjector__title">Fuel Injector</span>
    <span class="SysPanel__badge SysPanel__badge--idle" id="status-badge">IDLE</span>
    <span class="FuelInjector__parts" id="parts-line">&mdash;</span>
    <span class="FuelInjector__tank-chip FuelInjector__tank-chip--empty" id="tank-chip">No tank</span>
    <span class="FuelInjector__header-spacer"></span>
  </header>

  <div class="FuelInjector__stage">
    <!-- Input L1 -->
    <div class="FuelInjector__panel" id="panel-input">
      <div class="FuelInjector__panel-head">
        <span class="FuelInjector__panel-title">Layer 1 Intake</span>
        <span class="SysPanel__badge SysPanel__badge--connected" id="input-badge">CONNECTED</span>
      </div>
      <div class="FuelInjector__panel-body" id="body-input"></div>
    </div>

    <div class="FuelInjector__flow" aria-hidden="true">&rarr;</div>

    <!-- Reaction chamber -->
    <div class="FuelInjector__panel FuelInjector__panel--chamber" id="panel-chamber">
      <div class="FuelInjector__panel-head">
        <span class="FuelInjector__panel-title">Reaction Chamber</span>
        <span id="chamber-badges"></span>
      </div>
      <div class="FuelInjector__panel-body" id="body-chamber"></div>
    </div>

    <div class="FuelInjector__flow" aria-hidden="true">&rarr;</div>

    <!-- Exhaust L3 -->
    <div class="FuelInjector__panel" id="panel-exhaust">
      <div class="FuelInjector__panel-head">
        <span class="FuelInjector__panel-title">Layer 3 Exhaust</span>
        <span class="SysPanel__badge SysPanel__badge--connected" id="exhaust-badge">CONNECTED</span>
      </div>
      <div class="FuelInjector__panel-body" id="body-exhaust"></div>
    </div>
  </div>

  <footer class="FuelInjector__footer">
    <div class="FuelInjector__scenarios">
      <span class="FuelInjector__scenarios-label">Scenarios</span>
      <div id="scenario-buttons"></div>
    </div>
    <div class="FuelInjector__flameout-wrap">
      <span class="FuelInjector__flameout-tip" id="flameout-tip">Linked engines must be off</span>
      <button type="button" class="SysPanel__btn SysPanel__btn--fire" id="btn-flameout">Flameout</button>
    </div>
  </footer>
</div>

<script>
// ───────────────────────── Gas catalog (mock ISP metadata) ─────────────────────────
const GAS_CATALOG = {
  plasma:      { label: 'Plasma',       abbr: 'PL', color: '#ff3300', ispMult: 0.70, desc: 'Reactive propellant; pairs with O\u2082 for chemical bonus.' },
  oxygen:      { label: 'Oxygen',       abbr: 'O\u2082', color: '#0099ff', ispMult: 0.90, desc: 'Oxidizer; supports chemical burn mode.' },
  nitrogen:    { label: 'Nitrogen',     abbr: 'N\u2082', color: '#ccddee', ispMult: 1.00, desc: 'Inert buffer; moderate thermal expulsion.' },
  co2:         { label: 'CO\u2082',     abbr: 'CO\u2082', color: '#888888', ispMult: 0.75, desc: 'Low-ISP exhaust product; scrubbed to L3.' },
  water_vapor: { label: 'Water Vapor',  abbr: 'H\u2082O', color: '#aaccff', ispMult: 1.10, desc: 'Light molecule; decent thermal ISP.' },
  hydrogen:    { label: 'Hydrogen',     abbr: 'H\u2082', color: '#ffffff', ispMult: 3.50, desc: 'High ISP; requires thermal preheat.' },
  tritium:     { label: 'Tritium',      abbr: 'T', color: '#00ff88', ispMult: 2.00, desc: 'Reactive; high energy density.' },
  helium:      { label: 'Helium',       abbr: 'He', color: '#ff99ff', ispMult: 2.50, desc: 'Inert; excellent thermal expulsion.' },
};

const PLASMA_IGNITION_K = 373.15;
const ISP_NOMINAL_MAX = 1.5;
const EXHAUST_ISP_THRESHOLD = 0.5;

// Per-panel "show all gases" toggles
const showAllGases = { input: false, chamber: false, exhaust: false };
const expandedGases = new Set();
let showFactors = false;
let burnTickInterval = null;
let activeScenarioId = 'default';

// ───────────────────────── Mock state (ui_data contract) ─────────────────────────
let state = {};

function allGasIds() {
  return Object.keys(GAS_CATALOG);
}

/** Default two-stage filter maps — intake allow-list, exhaust scrub-list. */
function buildDefaultFilters() {
  const intake = {};
  const exhaust = {};
  for (const id of allGasIds()) {
    const isp = GAS_CATALOG[id].ispMult;
    intake[id] = isp > 0;
    exhaust[id] = isp <= EXHAUST_ISP_THRESHOLD;
  }
  // Burn products commonly routed to L3 even above auto threshold
  exhaust.co2 = true;
  return { intake, exhaust };
}

/** Fraction of incoming moles rejected by intake filter. */
function intakeRejectionRatio(rawComp) {
  let allowed = 0;
  for (const id of allGasIds()) {
    if (state.filters?.intake?.[id]) allowed += rawComp[id] || 0;
  }
  return 1 - allowed;
}

/** Chamber moles that would scrub to L3 given current exhaust filter + chamber mix. */
function scrubbedFraction(chamberComp) {
  let scrub = 0;
  for (const id of allGasIds()) {
    if (state.filters?.exhaust?.[id]) scrub += chamberComp[id] || 0;
  }
  return scrub;
}

/** Dynamic status pills from filter + pressure state. */
function deriveStatusPills() {
  const pills = [...(state.statusPills || [])];
  const hasBlocked = pills.some(p => p.includes('BLOCKED'));
  if (!hasBlocked && state.chamber.pressure > state.chamber.max_pressure * 0.95) {
    const scrubFrac = scrubbedFraction(state.chamber.gas_composition);
    if (scrubFrac < 0.05) pills.push('SCRUB STALLED');
  }
  return [...new Set(pills)];
}

function mix(plasma, oxygen, extras = {}) {
  const comp = { plasma, oxygen, nitrogen: 0, co2: 0, water_vapor: 0, hydrogen: 0, tritium: 0, helium: 0, ...extras };
  const total = Object.values(comp).reduce((a, b) => a + b, 0);
  const norm = {};
  for (const [k, v] of Object.entries(comp)) norm[k] = total > 0 ? v / total : 0;
  return norm;
}

function calcPerformance(chamber, perfOverrides = {}) {
  const comp = chamber.gas_composition;
  let weighted = 0, total = 0;
  for (const [id, frac] of Object.entries(comp)) {
    const moles = frac * chamber.total_moles;
    if (moles <= 0) continue;
    weighted += moles * (GAS_CATALOG[id]?.ispMult ?? 1);
    total += moles;
  }
  const gas_multiplier = total > 0 ? weighted / total : 1;
  const base_isp = perfOverrides.base_isp ?? 1.0;
  const chemical_bonus = perfOverrides.chemical_bonus ?? (
    chamber.temperature >= PLASMA_IGNITION_K && comp.plasma > 0.05 && comp.oxygen > 0.05 ? 1.15 : 1.0
  );
  const power_fraction = perfOverrides.power_fraction ?? 1.0;
  const estimated_isp = base_isp * gas_multiplier * chemical_bonus * power_fraction;
  const thrust_efficiency = Math.min(1, (estimated_isp / ISP_NOMINAL_MAX));
  const ship_mass = perfOverrides.ship_mass ?? 180;
  const propellant = chamber.total_moles * 0.05;
  const delta_v = ship_mass > 0 && chamber.total_moles > 0
    ? estimated_isp * 9.8 * Math.log((ship_mass + propellant) / ship_mass)
    : 0;
  return {
    estimated_isp: +estimated_isp.toFixed(3),
    thrust_efficiency: +thrust_efficiency.toFixed(3),
    delta_v: +delta_v.toFixed(2),
    base_isp,
    gas_multiplier: +gas_multiplier.toFixed(3),
    chemical_bonus,
    power_fraction,
    linked_engines: perfOverrides.linked_engines ?? 1,
    ship_mass,
    ship_mass_unknown: perfOverrides.ship_mass_unknown ?? false,
  };
}

function applyScenario(id) {
  stopBurnTick();
  activeScenarioId = id;
  const sc = SCENARIOS[id];
  if (!sc) return;
  const d = JSON.parse(JSON.stringify(sc.data));
  d.performance = {
    ...calcPerformance(d.chamber, sc.data.performance || {}),
    ...(sc.data.performance || {}),
  };
  if (sc.data.performance) {
    const p = sc.data.performance;
    if (p.power_fraction != null) {
      d.performance.estimated_isp = +(d.performance.base_isp * d.performance.gas_multiplier * d.performance.chemical_bonus * p.power_fraction).toFixed(3);
      d.performance.thrust_efficiency = +Math.min(1, d.performance.estimated_isp / ISP_NOMINAL_MAX).toFixed(3);
      d.performance.power_fraction = p.power_fraction;
    }
    if (p.ship_mass_unknown) d.performance.delta_v = 0;
  }
  d.statusPills = sc.data.statusPills || [];
  d.filters = sc.data.filters
    ? JSON.parse(JSON.stringify(sc.data.filters))
    : buildDefaultFilters();
  state = d;
  if (sc.animate) startBurnTick();
  render();
  updateScenarioButtons();
}

// ───────────────────────── Burn tick animation ─────────────────────────
function startBurnTick() {
  burnTickInterval = setInterval(() => {
    if (activeScenarioId !== 'burn' || !state.chamber.burning) return;
    state.chamber.total_moles = Math.max(0, state.chamber.total_moles - 0.8);
    state.chamber.temperature = Math.min(1200, state.chamber.temperature + 2);
    state.chamber.pressure = Math.max(200, state.chamber.pressure - 0.3);
    state.exhaust.total_moles += 0.4;
    state.exhaust.pressure = Math.min(400, state.exhaust.pressure + 0.5);
    state.performance = calcPerformance(state.chamber, {
      base_isp: 1 + 0.1 * (state.parts.micro_laser_rating - 1),
      linked_engines: state.performance.linked_engines,
      ship_mass: state.performance.ship_mass,
    });
    if (state.chamber.total_moles <= 0) {
      state.chamber.burning = false;
      state.chamber.consuming = false;
      stopBurnTick();
    }
    render();
  }, 400);
}

function stopBurnTick() {
  if (burnTickInterval) { clearInterval(burnTickInterval); burnTickInterval = null; }
}

// ───────────────────────── Render helpers ─────────────────────────
function barClassPressure(kpa) {
  if (kpa >= 450) return 'SysPanel__bar-fill--bad';
  if (kpa >= 300) return 'SysPanel__bar-fill--average';
  return 'SysPanel__bar-fill--good';
}

function barClassTemp(k) {
  if (k >= PLASMA_IGNITION_K) return 'SysPanel__bar-fill--hot';
  if (k >= 320) return 'SysPanel__bar-fill--warm';
  return 'SysPanel__bar-fill--cool';
}

function renderMetricRow(label, valueText, fillPct, fillClass, maxPct = 100) {
  const pct = Math.min(100, Math.max(0, (fillPct / maxPct) * 100));
  return `
    <div class="SysPanel__row SysPanel__row--metric">
      <span class="SysPanel__label">${label}</span>
      <div class="SysPanel__bar">
        <div class="SysPanel__bar-fill ${fillClass}" style="width:${pct}%"></div>
        <span class="SysPanel__bar-text">${valueText}</span>
      </div>
    </div>`;
}

function renderGasList(panelKey, composition, totalMoles, opts = {}) {
  const showAll = showAllGases[panelKey];
  const intakeFilter = opts.intakeFilter;
  const entries = Object.entries(composition)
    .filter(([, frac]) => showAll || frac > 0.001)
    .sort((a, b) => b[1] - a[1]);

  const toggleId = `toggle-${panelKey}`;
  let html = `
    <div class="FuelInjector__gas-head">
      <span class="SysPanel__section-title" style="margin:0;border:0;padding:0">Gas Composition</span>
      <button type="button" class="SysPanel__btn SysPanel__btn--scenario" id="${toggleId}">
        ${showAll ? 'Hide empty' : 'Show all'}
      </button>
    </div>`;

  if (!entries.length || totalMoles <= 0) {
    html += '<div class="FuelInjector__empty-gas">No gas detected</div>';
    return html;
  }

  for (const [gasId, frac] of entries) {
    const cat = GAS_CATALOG[gasId] || { label: gasId, color: '#888', ispMult: 1, desc: '' };
    const moles = frac * totalMoles;
    const pct = (frac * 100).toFixed(1);
    const expandKey = `${panelKey}:${gasId}`;
    const expanded = expandedGases.has(expandKey);
    const blocked = intakeFilter && !intakeFilter[gasId];
    html += `
      <div class="FuelInjector__gas-row${blocked ? ' FuelInjector__gas-row--blocked' : ''}">
        <div class="FuelInjector__gas-row-head">
          <span class="FuelInjector__gas-name">${cat.label}${blocked ? '<span class="FuelInjector__gas-blocked-tag">blocked</span>' : ''}</span>
          <span class="FuelInjector__gas-stats">${moles.toFixed(1)} mol (${pct}%)</span>
          <button type="button" class="FuelInjector__gas-chevron" data-expand="${expandKey}" title="ISP info">${expanded ? '\u25B2' : '\u25BC'}</button>
        </div>
        <div class="SysPanel__bar FuelInjector__gas-bar">
          <div class="SysPanel__bar-fill FuelInjector__gas-bar-fill" style="width:${Math.min(100, frac * 100)}%;background:${cat.color}99"></div>
          <span class="SysPanel__bar-text">${pct}%</span>
        </div>
        ${expanded ? `<div class="FuelInjector__gas-detail">ISP mult: ${cat.ispMult.toFixed(2)}\u00d7 \u2014 ${cat.desc}${blocked ? ' \u2014 Not permitted through intake filter.' : ''}</div>` : ''}
      </div>`;
  }
  return html;
}

function renderFilterSection(stage) {
  const isIntake = stage === 'intake';
  const filterMap = state.filters[stage];
  const title = isIntake ? 'Intake Filters' : 'Scrub Filters';
  const hint = isIntake
    ? 'Checked gases are pulled from L1 into the chamber (stage 1).'
    : 'Checked gases are scrubbed from chamber to L3 (stage 2).';
  const presetHtml = isIntake
    ? `<button type="button" class="SysPanel__btn SysPanel__btn--scenario" data-filter-preset="intake-propellants">Propellants</button>
       <button type="button" class="SysPanel__btn SysPanel__btn--scenario" data-filter-preset="intake-all">Allow all</button>`
    : `<button type="button" class="SysPanel__btn SysPanel__btn--scenario" data-filter-preset="exhaust-auto">Auto slag</button>
       <button type="button" class="SysPanel__btn SysPanel__btn--scenario" data-filter-preset="exhaust-burn">Burn products</button>`;

  let btns = '';
  for (const id of allGasIds()) {
    const cat = GAS_CATALOG[id];
    const on = !!filterMap[id];
    btns += `<button type="button"
      class="FuelInjector__filter-btn${on ? ' FuelInjector__filter-btn--on' : ''}${isIntake ? '' : ' FuelInjector__filter-btn--exhaust'}"
      style="--gas-accent:${cat.color}"
      data-filter-stage="${stage}"
      data-filter-gas="${id}"
      title="${cat.label} \u2022 ISP ${cat.ispMult.toFixed(2)}\u00d7">
      <span class="FuelInjector__filter-check">${on ? '\u2713' : '\u25A1'}</span>${cat.abbr}
    </button>`;
  }

  let note = '';
  if (isIntake && state.input.connected && state.input.total_moles > 0) {
    const reject = intakeRejectionRatio(state.input.gas_composition);
    if (reject > 0.001) {
      note = `<div class="FuelInjector__filter-note">${(reject * 100).toFixed(0)}% of line moles rejected at intake</div>`;
    } else {
      note = `<div class="FuelInjector__filter-note FuelInjector__filter-note--good">All line gases accepted</div>`;
    }
  }
  if (!isIntake && state.chamber.total_moles > 0) {
    const scrub = scrubbedFraction(state.chamber.gas_composition);
    note = `<div class="FuelInjector__filter-note">${(scrub * 100).toFixed(0)}% of chamber mix eligible for L3 scrub</div>`;
  }

  return `
    <div class="FuelInjector__filter-section">
      <div class="FuelInjector__filter-head">
        <span class="SysPanel__section-title" style="margin:0;border:0;padding:0">${title}</span>
      </div>
      <div class="FuelInjector__filter-hint">${hint}</div>
      <div class="FuelInjector__filter-grid">${btns}</div>
      <div class="FuelInjector__filter-presets">${presetHtml}</div>
      ${note}
    </div>`;
}

function renderSidePanel(panelKey, side, opts = {}) {
  const { connected, pressure, temperature, total_moles, max_moles, max_pressure, gas_composition } = side;
  const maxM = max_moles || 250;
  const maxP = max_pressure || 450;

  let html = '';

  if (opts.showTank && state.tank?.installed) {
    html += `<div class="SysPanel__section">
      <div class="SysPanel__section-title">Handheld Tank</div>
      <div class="SysPanel__row"><span class="SysPanel__label">${state.tank.name}</span>
        <span class="SysPanel__value">${state.tank.moles.toFixed(1)} mol</span></div>
    </div>`;
  }

  // Stage 1: intake filters before line reading
  if (panelKey === 'input') {
    html += renderFilterSection('intake');
  }

  // Stage 2: scrub filters before exhaust line reading
  if (panelKey === 'exhaust') {
    html += renderFilterSection('exhaust');
  }

  html += '<div class="SysPanel__section">';
  html += `<div class="SysPanel__section-title">${panelKey === 'input' ? 'Line Reading' : panelKey === 'exhaust' ? 'Exhaust Line' : 'Chamber Mix'}</div>`;

  if (!connected && panelKey === 'input') {
    html += '<div class="FuelInjector__empty-gas" style="margin-bottom:8px">Pipe not connected</div>';
  } else if (!connected && panelKey === 'exhaust') {
    html += '<div class="FuelInjector__empty-gas" style="margin-bottom:8px">Exhaust line not connected</div>';
  }

  if (connected || total_moles > 0) {
    html += renderMetricRow('Pressure', `${pressure.toFixed(1)} kPa`, pressure, barClassPressure(pressure), maxP);
    html += renderMetricRow('Temperature', `${temperature.toFixed(1)} K`, temperature, barClassTemp(temperature), 1200);
    html += renderMetricRow('Moles', `${total_moles.toFixed(1)} / ${maxM}`, total_moles, 'SysPanel__bar-fill--energy', maxM);
  }

  html += '</div>';
  const gasOpts = panelKey === 'input' ? { intakeFilter: state.filters.intake } : {};
  html += renderGasList(panelKey, gas_composition || {}, total_moles, gasOpts);

  return html;
}

        <div class="SysPanel__row"><span class="SysPanel__label">Grid power</span><span class="SysPanel__value">${(p.power_fraction * 100).toFixed(0)}%</span></div>
        <div class="SysPanel__row"><span class="SysPanel__label">Linked engines</span><span class="SysPanel__value">${p.linked_engines}</span></div>
        <div class="SysPanel__row"><span class="SysPanel__label">Ship dry mass</span><span class="SysPanel__value">${p.ship_mass_unknown ? '\u2014' : p.ship_mass + ' turfs'}</span></div>
      </div>
    </div>`;
}

function render() {
  const c = state.chamber;
  const parts = state.parts;

  // Header
  const statusBadge = document.getElementById('status-badge');
  if (c.consuming) {
    statusBadge.textContent = 'CONSUMING';
    statusBadge.className = 'SysPanel__badge SysPanel__badge--consuming';
  } else if (c.burning) {
    statusBadge.textContent = 'BURNING';
    statusBadge.className = 'SysPanel__badge SysPanel__badge--burning';
  } else {
    statusBadge.textContent = 'IDLE';
    statusBadge.className = 'SysPanel__badge SysPanel__badge--idle';
  }

  document.getElementById('parts-line').textContent =
    `${parts.chamber_volume} L chamber \u2022 ${c.max_pressure} kPa max \u2022 ${state.performance.linked_engines} engine(s) \u2022 Bin T${parts.matter_bin_rating} / Laser T${parts.micro_laser_rating}`;

  const tankChip = document.getElementById('tank-chip');
  if (state.tank?.installed) {
    tankChip.textContent = `${state.tank.name} \u2022 ${state.tank.moles.toFixed(0)} mol`;
    tankChip.className = 'FuelInjector__tank-chip';
  } else {
    tankChip.textContent = 'No tank';
    tankChip.className = 'FuelInjector__tank-chip FuelInjector__tank-chip--empty';
  }

  // Connection badges
  const inBadge = document.getElementById('input-badge');
  inBadge.textContent = state.input.connected ? 'CONNECTED' : 'NO PIPE';
  inBadge.className = 'SysPanel__badge ' + (state.input.connected ? 'SysPanel__badge--connected' : 'SysPanel__badge--disconnected');

  const exBadge = document.getElementById('exhaust-badge');
  exBadge.textContent = state.exhaust.connected ? 'CONNECTED' : 'NO PIPE';
  exBadge.className = 'SysPanel__badge ' + (state.exhaust.connected ? 'SysPanel__badge--connected' : 'SysPanel__badge--disconnected');

  // Chamber panel burning glow
  const chamberPanel = document.getElementById('panel-chamber');
  chamberPanel.classList.toggle('FuelInjector__panel--burning', !!c.burning);

  // Panel bodies
  document.getElementById('body-input').innerHTML = renderSidePanel('input', state.input, { showTank: true });
  document.getElementById('body-chamber').innerHTML =
    renderSidePanel('chamber', { ...c, max_moles: c.max_moles, max_pressure: c.max_pressure }) +
    renderPerformance();
  document.getElementById('body-exhaust').innerHTML = renderSidePanel('exhaust', state.exhaust);

  // Flameout
  const btnFlame = document.getElementById('btn-flameout');
  btnFlame.disabled = !state.can_flameout;
  btnFlame.classList.toggle('SysPanel__btn--disabled', !state.can_flameout);
  const tip = document.getElementById('flameout-tip');
  tip.classList.toggle('FuelInjector__flameout-tip--show', !state.can_flameout);

  bindPanelEvents();
}

function bindPanelEvents() {
  for (const key of ['input', 'chamber', 'exhaust']) {
    const btn = document.getElementById(`toggle-${key}`);
    if (btn) btn.onclick = () => { showAllGases[key] = !showAllGases[key]; render(); };
  }
  document.querySelectorAll('[data-expand]').forEach(el => {
    el.onclick = () => {
      const k = el.dataset.expand;
      if (expandedGases.has(k)) expandedGases.delete(k);
      else expandedGases.add(k);
      render();
    };
  });
  document.querySelectorAll('[data-filter-stage]').forEach(el => {
    el.onclick = () => {
      const stage = el.dataset.filterStage;
      const gas = el.dataset.filterGas;
      state.filters[stage][gas] = !state.filters[stage][gas];
      render();
    };
  });
  document.querySelectorAll('[data-filter-preset]').forEach(el => {
    el.onclick = () => applyFilterPreset(el.dataset.filterPreset);
  });
  const ft = document.getElementById('factors-toggle');
  if (ft) ft.onclick = () => { showFactors = !showFactors; render(); };
}

function applyFilterPreset(preset) {
  const f = state.filters;
  switch (preset) {
    case 'intake-propellants':
      for (const id of allGasIds()) {
        const isp = GAS_CATALOG[id].ispMult;
        f.intake[id] = isp >= 0.70;
      }
      break;
    case 'intake-all':
      for (const id of allGasIds()) f.intake[id] = true;
      break;
    case 'exhaust-auto':
      for (const id of allGasIds()) {
        f.exhaust[id] = GAS_CATALOG[id].ispMult <= EXHAUST_ISP_THRESHOLD;
      }
      f.exhaust.co2 = true;
      break;
    case 'exhaust-burn':
      f.exhaust.plasma = false;
      f.exhaust.oxygen = false;
      f.exhaust.co2 = true;
      f.exhaust.water_vapor = true;
      f.exhaust.nitrogen = true;
      f.exhaust.hydrogen = false;
      f.exhaust.tritium = false;
      f.exhaust.helium = false;
      break;
  }
  render();
}

function updateScenarioButtons() {
  const wrap = document.getElementById('scenario-buttons');
  wrap.innerHTML = '';
  for (const [id, sc] of Object.entries(SCENARIOS)) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'SysPanel__btn SysPanel__btn--scenario' + (id === activeScenarioId ? ' SysPanel__btn--active' : '');
    btn.textContent = sc.label;
    btn.onclick = () => applyScenario(id);
    wrap.appendChild(btn);
  }
}

document.getElementById('btn-flameout').onclick = () => {
  if (!state.can_flameout) return;
  state.chamber.total_moles = 0;
  state.chamber.pressure = 0;
  state.chamber.burning = false;
  state.chamber.consuming = false;
  state.chamber.gas_composition = mix(0, 0);
  state.performance = calcPerformance(state.chamber, { ship_mass_unknown: state.performance.ship_mass_unknown });
  state.statusPills = [];
  stopBurnTick();
  render();
};

// ───────────────────────── Init ─────────────────────────
updateScenarioButtons();
applyScenario('default');
</script>
</body>
</html>
